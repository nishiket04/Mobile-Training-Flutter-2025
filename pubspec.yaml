name: flutter_task
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.8.0+1
  get: ^4.7.2
  image_picker: ^1.1.2
  http: ^1.3.0
  event_bus: ^2.0.1
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.4
  flutter_local_notifications: ^19.1.0
  firebase_messaging: ^15.2.5
  firebase_core: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Tektur
      fonts:
        - asset: assets/fonts/Tektur-Bold.ttf
        - asset: assets/fonts/Tektur-Medium.ttf
        - asset: assets/fonts/Tektur-Regular.ttf
        - asset: assets/fonts/Tektur-SemiBold.ttf
